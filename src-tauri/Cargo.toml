[package]
name        = "anyfile-convert"
version     = "0.1.2"
edition     = "2021"
description = "AnyFile Convert — privacy-first, offline-first file toolbox"
authors     = ["AnyFile Convert Contributors"]
license     = "GPL-3.0-or-later"
repository  = "https://github.com/anyfile-converter/Anyfile-Converter"

# lib.rs is required for Tauri 2.x mobile/app handle access
[lib]
name       = "anyfile_convert_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri              = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde              = { workspace = true }
serde_json         = { workspace = true }
tokio              = { workspace = true }
tracing            = { workspace = true }
tracing-subscriber = { workspace = true }
reqwest            = { version = "0.12", features = ["json", "rustls-tls", "default-tls"] }
uuid               = { workspace = true }

# Our crates
anyfile-core    = { workspace = true }
anyfile-tools   = { workspace = true }
anyfile-engines = { workspace = true }
anyfile-fs      = { workspace = true }
tauri-plugin-dialog = "2.7.2"
winreg = "0.56.0"
tauri-plugin-updater = "2.10.1"
tauri-plugin-process = "2.3.1"
