[workspace]
members = [
    "src-tauri",
    "crates/anyfile-core",
    "crates/anyfile-tools",
    "crates/anyfile-engines",
    "crates/anyfile-fs",
]
resolver = "2"

# ---------------------------------------------------------------------------
# Workspace-level shared dependency versions.
# All crates reference these with `workspace = true` — no version drift.
# ---------------------------------------------------------------------------
[workspace.dependencies]
tokio       = { version = "1",    features = ["full"] }
serde       = { version = "1",    features = ["derive"] }
serde_json  = "1"
uuid        = { version = "1",    features = ["v4", "serde"] }
thiserror   = "1"
anyhow      = "1"
tracing     = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
async-trait = "0.1"
tokio-util  = { version = "0.7",  features = ["rt"] }
chrono      = { version = "0.4",  features = ["serde"] }

# Crate cross-references
anyfile-core    = { path = "crates/anyfile-core" }
anyfile-tools   = { path = "crates/anyfile-tools" }
anyfile-engines = { path = "crates/anyfile-engines" }
anyfile-fs      = { path = "crates/anyfile-fs" }
