name: Release

on:
  push:
    tags:
      - 'v*' # Trigger this workflow when pushing a tag like v0.1.0

jobs:
  release:
    name: Build and Release
    runs-on: windows-latest
    permissions:
      contents: write
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
          
      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        
      - name: Install Frontend Dependencies
        run: npm ci
        
      - name: Build and Upload Tauri App
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'AnyFile Convert ${{ github.ref_name }}'
          releaseDraft: false
          prerelease: false
          releaseBody: |
            ## 🎉 AnyFile Convert 1.0.0 - First Public Release
            
            Welcome to the first official release of **AnyFile Convert**!
            
            ### ✨ Features Included
            - 🚀 Complete offline-first native processing architecture
            - 🖼️ Lightning-fast Image tools (JPG <-> PNG, Compress)
            - 📄 PDF tools (Merge, Split)
            - 🤐 Archive tools (Create/Extract ZIP)
            - 🎥 Video tools (Extract Audio via FFmpeg)
            - 🔄 Secure Cryptographic Auto-Updater
            - 🎨 Premium Dark/Red glassmorphism aesthetic UI
            - 🪟 Native Windows Context Menu (Right-click) integration

            *Enjoy complete privacy with 0 cloud uploads and 0 tracking!*
          args: ${{ matrix.args }}
