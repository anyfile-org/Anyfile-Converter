name: Release

on:
  push:
    tags:
      - 'v*' # Trigger this workflow when pushing a tag like v0.1.0

jobs:
  release:
    name: Build and Release
    runs-on: windows-latest
    permissions:
      contents: write
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
          
      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        
      - name: Install Frontend Dependencies
        run: npm ci
        
      - name: Build and Upload Tauri App
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'AnyFile Convert ${{ github.ref_name }}'
          releaseDraft: false
          prerelease: false
          releaseBody: |
            ## AnyFile Convert ${{ github.ref_name }}

            ### What's new
            - Added WebP and AVIF image export in the desktop app and browser converter.
            - Replaced sample dashboard numbers with consent-based, database-backed usage analytics and a protected admin dashboard.
            - Added a paginated analytics event table with button clicks, completed operations, file quantities, and Windows app versions.
            - Improved browser conversion downloads, duplicate filename handling, and conversion error reporting.
            - Refined the website navigation, app settings, and local file picker feedback.

            ### Included tools
            - Images: JPG/PNG conversion, WebP/AVIF export, and compression.
            - PDFs: merge documents and extract page ranges.
            - Archives: create and extract ZIP files.
            - Video: extract audio with locally installed FFmpeg.

            File processing stays on your device. Optional analytics does not include file names, paths, or contents.
            Download the Windows installer from the assets below. Licensed under GPL-3.0-or-later.
